name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -f docker/Dockerfile.api -t ghcr.io/${{ github.repository }}-api:latest .
      - run: docker build -f docker/Dockerfile.web -t ghcr.io/${{ github.repository }}-web:latest .
      - run: docker push ghcr.io/${{ github.repository }}-api:latest
      - run: docker push ghcr.io/${{ github.repository }}-web:latest
