version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-kasbyol/kasbyol-ai}-api:latest
    restart: always
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-kasbyol/kasbyol-ai}-web:latest
    restart: always
    env_file:
      - .env
