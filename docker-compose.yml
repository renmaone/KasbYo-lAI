version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kasbyol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kasbyol
      POSTGRES_PASSWORD: kasbyol_secret
      POSTGRES_DB: kasbyol_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasbyol -d kasbyol_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kasbyol-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kasbyol-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: kasbyol-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: kasbyol-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: "postgresql://kasbyol:kasbyol_secret@postgres:5432/kasbyol_db?schema=public"
      REDIS_HOST: "redis"
      S3_ENDPOINT: "http://minio:9000"
      SMTP_HOST: "mailhog"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: kasbyol-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    ports:
      - "3000:3000"

volumes:
  pg_data:
  minio_data:
